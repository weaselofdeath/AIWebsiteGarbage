<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bandit Simulator TD Compendium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Source+Sans+3:wght@400;600;700&family=Noto+Serif+SC:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: lacquered masthead + group tabs; full-width register; each entry is its own page with a large heading band and two reading columns. */
:root {
  --paper: #f3f5f1; --sheet: #ffffff; --ink: #18201c; --ink-2: #3f4a44; --ink-3: #6b766f;
  --rule: #d5dcd3; --hover: #e8ede6; --band: #1d2a25; --band-2: #26362f; --band-ink: #eef3ee; --band-dim: #a9b8af;
  --seal: #b3361f; --seal-ink: #fff6f0; --jade: #2b6a59;
  --q1: #6b7470; --q2: #2e8a3e; --q3: #2a6fb0; --q4: #a03aa8; --q5: #a86f00; --q6: #c0261a;
  --c-orange: #b55a00; --c-green: #2e8a3e; --c-blue: #2a6fb0; --c-yellow: #8a6a00; --c-red: #c0261a; --c-pink: #a03aa8;
  --f-display: "Marcellus SC", "Palatino Linotype", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-cn: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 8px; --max: 1180px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151b; --sheet: #191d25; --ink: #e8eae6; --ink-2: #b9bfbb; --ink-3: #868d8a;
  --rule: #2d333e; --hover: #222833; --band: #0b0e12; --band-2: #171c24; --band-ink: #eef1ec; --band-dim: #8e9893;
  --seal: #e0583b; --seal-ink: #1a0d08; --jade: #70c6ab;
  --q1: #a7adab; --q2: #6fd17a; --q3: #6fb1f0; --q4: #e08ae8; --q5: #f0c04a; --q6: #ff6a55;
  --c-orange: #f0a050; --c-green: #7ad685; --c-blue: #7fbaf2; --c-yellow: #f0d060; --c-red: #ff7a66; --c-pink: #e8a0ee;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #12151b; --sheet: #191d25; --ink: #e8eae6; --ink-2: #b9bfbb; --ink-3: #868d8a;
  --rule: #2d333e; --hover: #222833; --band: #0b0e12; --band-2: #171c24; --band-ink: #eef1ec; --band-dim: #8e9893;
  --seal: #e0583b; --seal-ink: #1a0d08; --jade: #70c6ab;
  --q1: #a7adab; --q2: #6fd17a; --q3: #6fb1f0; --q4: #e08ae8; --q5: #f0c04a; --q6: #ff6a55;
  --c-orange: #f0a050; --c-green: #7ad685; --c-blue: #7fbaf2; --c-yellow: #f0d060; --c-red: #ff7a66; --c-pink: #e8a0ee;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap { max-width: var(--max); margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* masthead */
.mast { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.mast-in { display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: inherit; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.seal { display: grid; place-items: center; width: 42px; height: 42px; background: var(--seal); color: var(--seal-ink); font: 700 15px/1 var(--f-cn); border-radius: 4px; writing-mode: vertical-rl; flex: none; }
.brand b { display: block; font: 24px/1.1 var(--f-display); letter-spacing: .02em; }
.brand small { display: block; color: var(--band-dim); font: 13px/1.3 var(--f-cn); }
.search { flex: 1 1 300px; max-width: 480px; margin-left: auto; position: relative; display: block; }
.search input { width: 100%; font: 15px var(--f-body); padding: 9px 12px 9px 36px; border: 1px solid transparent; border-radius: var(--r); background: var(--band-2); color: var(--band-ink); }
.search input::placeholder { color: var(--band-dim); }
.search input:focus { outline: 2px solid var(--jade); outline-offset: 0; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--band-dim); }
.groups { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.groups button { border: 0; background: none; color: var(--band-dim); font: 600 14px var(--f-body); padding: 9px 14px 11px; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
.groups button:hover { color: var(--band-ink); }
.groups button[aria-current="true"] { color: var(--band-ink); border-bottom-color: var(--seal); }
.subnav { background: var(--sheet); border-bottom: 1px solid var(--rule); }
.subnav .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin; }
.subnav button { flex: none; display: inline-flex; gap: 8px; align-items: baseline; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); font: 600 14px var(--f-body); padding: 5px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.subnav button span { font: 12px var(--f-mono); opacity: .7; }
.subnav button:hover { border-color: var(--ink-3); color: var(--ink); }
.subnav button[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

main#main { padding-block: 24px 64px; }

/* browse */
.listhead { display: grid; gap: 12px; margin-bottom: 14px; }
.listhead h1 { margin: 0; font: 32px/1.1 var(--f-display); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; text-wrap: balance; }
.listhead h1 small { font: 15px var(--f-body); color: var(--ink-3); }
.blurb { margin: 0; color: var(--ink-2); max-width: 72ch; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.fgroup { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.fgroup > span { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); margin-right: 2px; }
.chip { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); font: 14px var(--f-body); padding: 3px 11px; border-radius: 999px; cursor: pointer; }
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--jade); border-color: var(--jade); color: var(--sheet); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.toolbar label { font-size: 13px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.toolbar select { font: 14px var(--f-body); padding: 4px 8px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--sheet); color: var(--ink-2); font: 14px var(--f-body); padding: 4px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.kbd { margin-left: auto; font-size: 13px; color: var(--ink-3); }
.kbd kbd { font: 11.5px var(--f-mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--sheet); }

#rows { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
#rows.bare { background: none; border: 0; overflow: visible; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: center; width: 100%; padding: 8px 16px; border: 0; border-bottom: 1px solid var(--rule); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover, .row:focus-visible { background: var(--hover); }
.row .nm { min-width: 0; }
.row .nm b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm i { font: normal 13.5px var(--f-cn); color: var(--ink-3); }
.row .m1 { color: var(--ink-2); font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m2 { color: var(--ink-3); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.star-mark { color: var(--seal); margin-left: 6px; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.tile { display: grid; justify-items: center; align-content: start; gap: 6px; padding: 14px 8px 10px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); color: inherit; font: 14px/1.25 var(--f-body); text-align: center; cursor: pointer; min-width: 0; }
.tile:hover, .tile:focus-visible { border-color: var(--jade); }
.tile b { font-weight: 600; overflow-wrap: anywhere; }
.tile i { font: normal 12.5px var(--f-cn); color: var(--ink-3); }
h3.grp { margin: 0; padding: 14px 16px 6px; font: 12px var(--f-body); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); border-bottom: 1px solid var(--rule); background: var(--paper); }
.more { display: block; margin: 16px auto 0; }
.empty { padding: 48px 16px; color: var(--ink-3); text-align: center; }

/* entry page */
.crumbs { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; font-size: 14px; color: var(--ink-3); }
.crumbs .sp { flex: 1; }
.tbtn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); font: 14px var(--f-body); padding: 5px 14px; border-radius: 999px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbtn:hover { border-color: var(--jade); color: var(--ink); }
.tbtn[aria-pressed="true"] { color: var(--seal); border-color: var(--seal); }
.ehead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; padding: 24px; margin-bottom: 32px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.ehead .kind { font-size: 12.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--seal); font-weight: 700; }
.ehead h1 { margin: 2px 0 0; font: 40px/1.05 var(--f-display); text-wrap: balance; }
.ehead .cn { font: 500 19px var(--f-cn); color: var(--ink-2); margin-top: 4px; }
.lede { margin: 12px 0 0; max-width: 68ch; color: var(--ink-2); font-size: 17px; }
.portrait { border-radius: var(--r); background: var(--paper); padding: 6px; display: grid; place-items: center; }
.ebody { columns: 2 440px; column-gap: 48px; }
.sec { break-inside: avoid; display: block; margin: 0 0 32px; }
.sec h4 { margin: 0 0 10px; font: 13px var(--f-body); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); display: flex; gap: 10px; align-items: center; }
.sec h4::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 24px; margin: 0; }
dl.kv dt { color: var(--ink-3); }
dl.kv dd { margin: 0; min-width: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14.5px; }
.src { display: grid; gap: 10px; }
.src > div { padding: 12px 14px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); }
.src b { display: block; font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--jade); margin-bottom: 2px; }
.links { display: flex; flex-wrap: wrap; gap: 7px; }
a.ln { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 3px; border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); color: var(--ink); text-decoration: none; font: 15px var(--f-body); cursor: pointer; max-width: 100%; }
a.ln:hover { border-color: var(--jade); color: var(--jade); }
a.ln.plain { padding-left: 11px; }
a.ln .spr { border-radius: 999px; }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; }
table.t th, table.t td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align: left; }
table.t th { font-weight: 600; color: var(--ink-3); font-size: 13px; }
table.t td.num, table.t th.num { text-align: right; }
.tscroll { overflow-x: auto; }
.bar { height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--jade); }
.desc { margin: 0 0 8px; color: var(--ink-2); max-width: 68ch; }
.note { font-size: 14px; color: var(--ink-3); margin: 8px 0 0; }
.pill { display: inline-block; padding: 0 9px; border-radius: 999px; font-size: 13.5px; font-weight: 600; border: 1px solid currentColor; }
.q1 { color: var(--q1); } .q2 { color: var(--q2); } .q3 { color: var(--q3); } .q4 { color: var(--q4); } .q5 { color: var(--q5); } .q6 { color: var(--q6); }
.c-orange { color: var(--c-orange); } .c-green { color: var(--c-green); } .c-blue { color: var(--c-blue); } .c-yellow { color: var(--c-yellow); } .c-red { color: var(--c-red); } .c-pink { color: var(--c-pink); }
.spr { display: inline-block; flex: none; background-repeat: no-repeat; }
.ph { display: grid; place-items: center; background: var(--hover); border-radius: var(--r); color: var(--ink-3); font: 600 15px var(--f-cn); flex: none; }
button:focus-visible, a:focus-visible, .row:focus-visible { outline: 2px solid var(--jade); outline-offset: -2px; }

/* recipe tree */
.rtree, .rtree ul { list-style: none; margin: 0; padding: 0; }
.rtree ul { margin-left: 12px; }
.rtree li { position: relative; padding: 5px 0 5px 22px; }
.rtree > li { padding-left: 0; }
.rtree ul > li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--rule); }
.rtree ul > li:last-child::before { bottom: auto; height: 21px; }
.rtree ul > li::after { content: ""; position: absolute; left: 0; top: 21px; width: 17px; border-top: 2px solid var(--rule); }
.rn { display: inline-flex; flex-wrap: wrap; gap: 3px 9px; align-items: center; max-width: 100%; }
.rn em { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--jade); text-transform: uppercase; letter-spacing: .07em; }
.rn .note { margin: 0; }
.rtree > li > .rn strong { font: 19px var(--f-display); }
.need { display: grid; gap: 8px; padding: 14px 16px; border: 1px dashed var(--jade); border-radius: var(--r); background: var(--sheet); }
.need p { margin: 0; }
.need p > b { display: block; font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--jade); margin-bottom: 4px; }

/* class path */
.path { display: flex; flex-wrap: wrap; gap: 6px 2px; align-items: center; }
.path .arr { font: 12px var(--f-mono); color: var(--ink-3); padding: 0 6px; white-space: nowrap; }

/* class tree chart */
.chart { overflow: auto; padding: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); margin-top: 12px; }
.ctree { position: relative; }
.ctree svg { position: absolute; inset: 0; overflow: visible; }
.ctree path { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.ctree path.hl { stroke: var(--seal); stroke-width: 2.5; }
.rankh { position: absolute; top: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); }
.cnode { position: absolute; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 10px 0 4px; border: 1px solid var(--rule); border-left: 4px solid var(--ty); border-radius: var(--r); background: var(--paper); color: var(--ink); font: 14px/1.1 var(--f-body); text-align: left; cursor: pointer; }
.cnode:hover { border-color: var(--ty); }
.cnode span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dimmed .cnode:not(.hl) { opacity: .38; }
.cnode.hl { box-shadow: 0 0 0 1px var(--ty); }
.cnode.sel { background: var(--hover); font-weight: 700; }
.ty-Strength { --ty: var(--c-orange); } .ty-Agility { --ty: var(--c-green); } .ty-Spell { --ty: var(--c-blue); } .ty-Production { --ty: var(--c-yellow); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-2); }
.legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 2px; background: var(--ty); margin-right: 7px; vertical-align: -1px; }

/* progression ladder */
.ladder { list-style: none; margin: 0; padding: 4px 0 0; display: grid; }
.ladder > li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 16px; }
.ladder > li::before { content: ""; position: absolute; left: 31px; top: 30px; bottom: 0; border-left: 2px solid var(--rule); }
.ladder > li:last-child::before { display: none; }
.step { width: 64px; height: 30px; display: grid; place-items: center; border-radius: 999px; background: var(--ink); color: var(--paper); font: 600 13px var(--f-mono); position: relative; z-index: 1; }
.lrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; min-width: 0; }
.lcard { flex: 1 1 300px; min-width: 0; padding: 10px 14px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); display: grid; gap: 6px; }
.lcard.wild { flex: 1 1 260px; border-style: dashed; border-color: var(--jade); background: var(--paper); }
.lcard .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lcard .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--ink-3); }
.lcard .facts b { color: var(--ink); font-weight: 600; }

/* builds */
.rb { margin: 0 0 36px; padding: 20px 22px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); display: grid; gap: 16px; }
.rb h2 { margin: 0; font: 24px/1.1 var(--f-display); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.rb h2 small { font: 14px var(--f-body); color: var(--ink-3); }
.rbctl { display: grid; gap: 8px; }
.rbctl .fgroup { gap: 4px; }
.tierseg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.tierseg button { border: 0; border-right: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); font: 600 13px var(--f-mono); padding: 5px 10px; cursor: pointer; }
.tierseg button:last-child { border-right: 0; }
.tierseg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.rbgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px 32px; }
.score { display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: baseline; }
.score .big { font: 600 28px var(--f-mono); color: var(--jade); }
.score .rank { font-weight: 700; color: var(--seal); }
.gear { display: grid; gap: 6px; }
.gear > div { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 10px; align-items: center; }
.gear .sl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 16px; font-size: 14px; }
.mini span { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--rule); padding: 2px 0; }
.mini span b { font: 13.5px var(--f-mono); font-weight: 600; }
.besttasks { display: flex; flex-wrap: wrap; gap: 6px; }
.besttasks button { border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); font: 13.5px var(--f-body); padding: 2px 10px; border-radius: 999px; cursor: pointer; }
.besttasks button b { color: var(--seal); font-family: var(--f-mono); margin-left: 4px; }
.caveat { font-size: 13.5px; color: var(--ink-3); margin: 0; max-width: 90ch; }
.bld { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 14px; min-width: 0; }
.panel h3 { margin: 0; font: 13px var(--f-body); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; }
.form label { display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.form select, .form input, .slotrow select, .slotrow input, .affix select, .affix input { font: 14px var(--f-body); padding: 5px 7px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); min-width: 0; width: 100%; }
.slotrow { display: grid; grid-template-columns: 70px 44px minmax(0, 1fr) 96px 64px; gap: 6px 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
.slotrow .sl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }

<script src="calc.js"></script>
<script>
"use strict";
let D = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const COLORS = { orange: "c-orange", lightgreen: "c-green", green: "c-green", lightblue: "c-blue", aqua: "c-blue", yellow: "c-yellow", gold: "c-yellow", red: "c-red", fuchsia: "c-pink", deeppink: "c-pink" };
function rich(s) {
  let out = esc(s).replace(/\[color=([^\]]+)\]/gi, (_, c) => `<span class="${COLORS[c.toLowerCase()] || ""}">`).replace(/\[\/color\]/gi, "</span>");
  const open = (out.match(/<span/g) || []).length - (out.match(/<\/span>/g) || []).length;
  return out + "</span>".repeat(Math.max(0, open));
}
const fmtNum = (v) => (typeof v === "number" ? (Math.round(v * 1000) / 1000).toLocaleString("en-US") : esc(v));

/* ---------- sprites ---------- */
function sprite(atlas, idx, size, fallback) {
  const A = D.atlas[atlas];
  if (idx == null || !A) return `<span class="ph" style="width:${size}px;height:${size}px">${esc((fallback || "?").slice(0, 1))}</span>`;
  const s = size / Math.max(A.cw, A.ch), w = A.cw * s, h = A.ch * s;
  const x = (idx % A.cols) * A.cw * s, y = Math.floor(idx / A.cols) * A.ch * s;
  return `<span class="spr" style="width:${w}px;height:${h}px;background-image:url(${A.file});background-size:${A.cols * A.cw * s}px ${A.rows * A.ch * s}px;background-position:-${x}px -${y}px" aria-hidden="true"></span>`;
}

/* ---------- lookups ---------- */
const by = {};
const T = (cat, id) => by[cat] && by[cat].get(id);
const stat = (id) => T("stats", id);
const statName = (id) => (stat(id) ? stat(id).n : `Stat ${id}`);
function statVal(id, v) {
  const s = stat(id); const f = s ? s.fmt : "int";
  if (f === "pct") return `${fmtNum(v)}%`;
  if (f === "mult") return `×${fmtNum(v)}`;
  return fmtNum(v);
}
const tierName = (t) => (t ? (D.meta.tiers[t] || `Tier ${t}`) : "—");

/* ---------- categories ---------- */
const ICONK = { heroes: "hero", foes: "foe" };
const CATS = [
  { k: "classtree", t: "Class tree", g: "Charts", view: () => viewClassTree(), count: () => D.classes.length,
    blurb: "Every hero starts as a Vagrant and branches out from there. Advance once the current class reaches Lv 10 (Lv 5 for Vagrant). Pick a class to light up its line." },
  { k: "progress", t: "World progression", g: "Charts", view: () => viewProgress(), count: () => D.locs.filter((l) => l.type === "City").length,
    blurb: "Cities open one after another: each needs the previous city at danger level 50. Wild areas branch off every third city and hold the spirit beasts that drop set and core materials." },
  { k: "starred", t: "Starred", g: "Charts", view: () => viewStarred(), count: () => stars.length,
    blurb: "Entries you starred. Stars are saved in this browser only." },
  { k: "builder", t: "Builder", g: "Builds", view: () => viewBuilder(), count: () => D.heroes.length,
    blurb: "Put a hero together: class, level, gear, quality and affixes. Stats are computed with the game's own formulas, and every task is scored live. Optimize fills in the best class and gear for the task you pick." },
  { k: "besthero", t: "Best heroes", g: "Builds", view: () => viewBest(), count: () => TASK_LIST().length,
    blurb: "Every hero ranked for one task at one tier, each using its own best build. Pick a row to see that build." },
  { k: "items", t: "Items", g: "Gear & goods", blurb: "Equipment, set pieces, cores, elixirs and Soul Tower treasures. Each entry shows where to get it: the blueprint, the materials, merge inputs, or the tower floor.",
    filters: [["Type", (x) => x.cat], ["Slot", (x) => x.slot || "—"], ["Tier", (x) => tierName(x.tier)]],
    meta: (x) => [x.cat, `${tierName(x.tier)}${x.sub ? " · " + x.sub : ""}`] },
  { k: "sets", t: "Gear sets", g: "Gear & goods", blurb: "Set bonuses activate at 2, 4 and 6 equipped pieces. Pieces are merged at the Forge from a regular item plus a beast material.",
    filters: [["Tier", (x) => tierName(x.tiers[0])]], meta: (x) => [`${x.pieces.length} pieces`, tierName(x.tiers[0])] },
  { k: "mats", t: "Materials", g: "Gear & goods", blurb: "Wood, ore, herbs, beast pills and alchemy pills used to build and craft.",
    filters: [["Type", (x) => x.type], ["Tier", (x) => `T${x.tier}`]], meta: (x) => [x.type, `T${x.tier}${x.gather ? " · " + x.gather : ""}`] },
  { k: "beasts", t: "Beast materials", g: "Gear & goods", blurb: "Spirit materials dropped by the rare spirit beast in each wild area. They are needed to merge set pieces and refine cores.",
    filters: [["Type", (x) => x.type]], meta: (x) => [x.type, `T${x.tier}`] },
  { k: "heroes", t: "Heroes", g: "People", blurb: "Every recruitable hero: aptitudes, starting class, work-skill caps, talents, and where to recruit them (tavern or captured governor).",
    filters: [["Rarity", (x) => x.rarityN], ["Recruit", (x) => recruitTag(x)]], meta: (x) => [x.rarityN, clsName(x.cls)] },
  { k: "classes", t: "Classes", g: "People", blurb: "The class tree. Each class needs one of its listed predecessor classes, grants a basic attack, an active skill and a passive.",
    filters: [["Type", (x) => x.type], ["Rank", (x) => `Rank ${x.tier}`]], meta: (x) => [x.type, `Rank ${x.tier}`] },
  { k: "skills", t: "Skills", g: "People", blurb: "Basic attacks, active skills and passives granted by classes.",
    filters: [["Type", (x) => x.type], ["Element", (x) => x.elem || "None"], ["Grade", (x) => x.qN]], meta: (x) => [x.type, [x.elem, x.qN].filter(Boolean).join(" · ")] },
  { k: "talents", t: "Talents", g: "People", blurb: "Innate hero talents, each with five levels. Values shown are what the game computes at each level.",
    filters: [["Scope", (x) => x.scope], ["Rarity", (x) => x.rarity]], meta: (x) => [x.scope, x.rarity] },
  { k: "locs", t: "World map", g: "World", blurb: "Cities, wild areas and the Soul Tower: what they produce, who lives there, and which blueprints their Lord Hall trades.",
    filters: [["Type", (x) => x.type], ["Region", (x) => x.region || "—"]], meta: (x) => [x.type, x.region] },
  { k: "foes", t: "Enemies", g: "World", blurb: "Raiders, wild monsters, challenge elites, spirit-beast bosses and city governors.",
    filters: [["Rank", (x) => x.rank], ["Faction", (x) => x.fac]], meta: (x) => [x.rank, x.fac] },
  { k: "buildings", t: "Buildings", g: "Stronghold", blurb: "Functional buildings and decorations for your mountain stronghold.",
    filters: [["Category", (x) => x.cat]], meta: (x) => [x.cat, `${x.sub} · ${x.size}`] },
  { k: "facilities", t: "Facilities", g: "Stronghold", blurb: "Work stations placed inside buildings: forges, workbenches, cauldrons, training posts, fields and mines, in tiers 1–10.",
    filters: [["Work", (x) => x.work], ["Tier", (x) => `T${x.tier}`]], meta: (x) => [x.work, `T${x.tier}`] },
  { k: "techs", t: "Technology", g: "Stronghold", blurb: "Research unlocks buildings, features and production bonuses.",
    filters: [["Branch", (x) => x.branch || "—"]], meta: (x) => [x.branch, x.eff] },
  { k: "quests", t: "Guide quests", g: "Progress", blurb: "The tutorial quest chain, in order.", filters: [["Type", (x) => x.goal]], meta: (x) => [x.goal, `#${x.id}`] },
  { k: "achievements", t: "Achievements", g: "Progress", blurb: "Milestones tracked by the game.", filters: [["Group", (x) => x.group]], meta: (x) => [x.group, `${x.metric}: ${x.target}`] },
  { k: "stats", t: "Stats glossary", g: "Reference", blurb: "Every attribute the game tracks, with its group and what it does.", filters: [["Group", (x) => x.grp]], meta: (x) => [x.grp, x.scope] },
  { k: "buffs", t: "Buffs", g: "Reference", blurb: "Timed status effects applied by active skills.", filters: [], meta: (x) => [statName(x.stat), `${x.dur}s`] },
];
const CAT = Object.fromEntries(CATS.map((c) => [c.k, c]));
// Singular label shown above an entry's name.
const KIND = { items: "Item", sets: "Gear set", mats: "Material", beasts: "Beast material", heroes: "Hero", classes: "Class", skills: "Skill",
  talents: "Talent", locs: "Place", foes: "Enemy", buildings: "Building", facilities: "Facility", techs: "Technology", quests: "Guide quest",
  achievements: "Achievement", stats: "Stat", buffs: "Buff" };
const DATA_CATS = CATS.filter((c) => !c.view);
const aptSum = (h) => h.apt[0] + h.apt[1] + h.apt[2];
const SORTS = {
  items: [["Tier", (x) => x.tier], ["Treasure rarity", (x) => -(x.rarity || 0)]],
  sets: [["Tier", (x) => x.tiers[0]]],
  mats: [["Tier", (x) => x.tier]],
  beasts: [["Tier", (x) => x.tier]],
  heroes: [["Rarity", (x) => -x.rarity], ["Total aptitude", (x) => -aptSum(x)], ["STR", (x) => -x.apt[0]], ["AGI", (x) => -x.apt[1]], ["INT", (x) => -x.apt[2]]],
  classes: [["Rank", (x) => x.tier]],
  skills: [["Multiplier", (x) => -x.coef], ["Cooldown", (x) => x.cd || 999], ["Grade", (x) => -x.q]],
  locs: [["Difficulty", (x) => x.diff]],
  foes: [["HP factor", (x) => -x.hp], ["Speed", (x) => -x.spd]],
  facilities: [["Tier", (x) => x.tier]],
  achievements: [["Target", (x) => x.target]],
};
const GRIDABLE = new Set(["items", "sets", "mats", "beasts", "heroes", "classes", "skills", "foes", "buffs", "buildings"]);

function iconOf(cat, x, size) {
  const atlas = ICONK[cat] || "icon";
  return sprite(atlas, x.icon, size, x.n);
}
const clsName = (id) => (T("classes", id) || {}).n || "—";
function recruitTag(h) {
  if (h.tavern) return "Tavern";
  if (D._gov.has(h.id)) return "Governor";
  return "Other";
}

/* ---------- link helpers ---------- */
function ln(cat, id, label) {
  const x = T(cat, id);
  if (!x) return esc(label || `#${id}`);
  const ic = cat === "stats" || cat === "techs" || cat === "quests" || cat === "achievements" || cat === "talents";
  return `<a class="ln${ic ? " plain" : ""}" href="#${cat}-${id}" data-go="${cat}-${id}">${ic ? "" : iconOf(cat, x, 22)}<span>${esc(label || x.n)}</span></a>`;
}
const links = (arr) => (arr.length ? `<div class="links">${arr.join("")}</div>` : `<span class="note">None</span>`);
const sec = (title, html) => (html ? `<section class="sec"><h4>${esc(title)}</h4>${html}</section>` : "");
const kv = (pairs) => `<section class="sec"><h4>Overview</h4><dl class="kv">${pairs.filter((p) => p[1] !== "" && p[1] != null).map(([a, b]) => `<dt>${esc(a)}</dt><dd>${b}</dd>`).join("")}</dl></section>`;
const qpill = (q, label) => `<span class="pill q${q}">${esc(label)}</span>`;

/* ---------- recipe tree ---------- */
const tnode = (label, html, kids = []) => `<li><span class="rn"><em>${esc(label)}</em>${html}</span>${kids.length ? `<ul>${kids.join("")}</ul>` : ""}</li>`;
function recipeNode(it, depth, need, label) {
  const S = it.src, kids = [];
  if (S.bp) {
    const c = T("locs", S.bp.city);
    if (c) need.bp.set(c.id, Math.max(need.bp.get(c.id) || 0, S.bp.lvl || 0));
    const where = { Forge: "Forge", Craft: "Workshop", Merge: "Forge (merge)", Refine: "Alchemy (refine)" }[S.bp.kind];
    kids.push(tnode(`Blueprint`, `${c ? ln("locs", c.id, `Lord Hall · ${c.n}`) : "?"}${S.bp.lvl ? ` <span class="note">from danger lv ${S.bp.lvl}</span>` : ""} <span class="note">· made at ${where}</span>`));
  }
  (S.mats || []).forEach((m) => { need.mats.add(m); const mt = T("mats", m); kids.push(tnode("Material", ln("mats", m) + (mt && mt.gather ? ` <span class="note">· ${esc(mt.gather)}</span>` : ""))); });
  const m = S.merge || S.refine;
  if (m) {
    const base = T("items", m.base);
    if (base) kids.push(depth < 2 ? recipeNode(base, depth + 1, need, S.merge ? `Base · any ${base.sub}` : "Base") : tnode("Base", ln("items", base.id)));
    const b = T("beasts", m.beast);
    if (b) {
      need.beasts.add(b.id);
      const boss = T("foes", b.boss), where = boss && D.locs.find((l) => l.beast === boss.id);
      if (where) need.places.add(where.id);
      const wk = where ? [tnode("Found in", ln("locs", where.id) + (where.unlock ? ` <span class="note">· opens at ${esc(T("locs", where.unlock[0]).n)} lv ${where.unlock[1]}</span>` : ""))] : [];
      kids.push(tnode("Beast material", ln("beasts", b.id), boss ? [tnode("Dropped by", ln("foes", boss.id), wk)] : []));
    }
  }
  if (S.tower != null) {
    const tower = D.locs.find((l) => l.cn === "万魂塔");
    kids.push(tnode("Loot", `${tower ? ln("locs", tower.id) : "Soul Tower"} <span class="note">· drawn after victories${S.tower ? `; exchange from floor ${S.tower}` : ""}</span>`));
  }
  if (S.shop) kids.push(tnode("Shop", `<span class="note">Random stock in city shops</span>`));
  if (S.brew) kids.push(tnode("Brew", `<span class="note">Alchemy blueprint at a Cauldron facility</span>`));
  return tnode(label || it.cat, depth === 0 ? `<strong>${esc(it.n)}</strong>` : ln("items", it.id), kids);
}

/* ---------- class lines ---------- */
const advLv = (preId) => (preId === 1 ? 5 : 10);
function classLine(id) {
  const out = []; let c = T("classes", id);
  while (c) { out.unshift(c); c = c.pre.length ? T("classes", c.pre[0]) : null; }
  return out;
}
const classKids = (id) => D.classes.filter((c) => c.pre.includes(id));
function classDesc(id) { const out = []; (function walk(i) { classKids(i).forEach((c) => { out.push(c); walk(c.id); }); })(id); return out; }
function pathHtml(line) {
  return `<div class="path">${line.map((c, i) => (i ? `<span class="arr">Lv ${advLv(line[i - 1].id)} →</span>` : "") + ln("classes", c.id)).join("")}</div>`;
}
const goTree = `<button type="button" class="tbtn" data-cat="classtree">Open the class tree</button>`;

/* ---------- chart views ---------- */
function selectedClass() {
  if (!state.sel) return null;
  const [k, id] = state.sel.split(/-(?=\d+$)/);
  if (k === "classes") return Number(id);
  if (k === "heroes") { const h = T("heroes", Number(id)); return h ? h.cls : null; }
  return null;
}
function viewClassTree() {
  const root = D.classes.find((c) => !c.pre.length);
  const RH = 44, CW = 200, NW = 172, NH = 36, TOP = 26;
  const pos = {}; let leaf = 0;
  (function place(c) {
    const ch = classKids(c.id); ch.forEach(place);
    pos[c.id] = { x: (c.tier - 1) * CW, y: TOP + (ch.length ? (pos[ch[0].id].y - TOP + pos[ch[ch.length - 1].id].y - TOP) / 2 : leaf++ * RH) };
  })(root);
  const maxTier = Math.max(...D.classes.map((c) => c.tier));
  const W = (maxTier - 1) * CW + NW, H = TOP + leaf * RH;
  const sel = selectedClass();
  const hl = new Set(sel ? [...classLine(sel), ...classDesc(sel)].map((c) => c.id) : []);
  const edges = D.classes.filter((c) => c.pre.length && pos[c.pre[0]]).map((c) => {
    const a = pos[c.pre[0]], b = pos[c.id], x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
    return `<path class="${hl.has(c.id) && hl.has(c.pre[0]) ? "hl" : ""}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`;
  }).join("");
  const heads = Array.from({ length: maxTier }, (_, i) => `<div class="rankh" style="left:${i * CW}px">Rank ${i + 1}</div>`).join("");
  const nodes = D.classes.map((c) => `<button type="button" class="cnode ty-${esc(c.type)}${hl.has(c.id) ? " hl" : ""}${c.id === sel ? " sel" : ""}" style="left:${pos[c.id].x}px;top:${pos[c.id].y}px;width:${NW}px" data-go="classes-${c.id}" title="${esc(c.n)} · ${esc(c.type)} · Rank ${c.tier}">${sprite("icon", c.icon, 26, c.n)}<span>${esc(c.n)}</span></button>`).join("");
  const types = [...new Set(D.classes.map((c) => c.type))];
  return `<div class="legend">${types.map((t) => `<span class="ty-${esc(t)}">${esc(t)}</span>`).join("")}</div>
    <div class="chart"><div class="ctree${sel ? " dimmed" : ""}" style="width:${W}px;height:${H}px">${heads}<svg width="${W}" height="${H}" aria-hidden="true">${edges}</svg>${nodes}</div></div>`;
}
function viewProgress() {
  const cities = D.locs.filter((l) => l.type === "City").sort((a, b) => a.diff - b.diff);
  const branches = (id) => D.locs.filter((l) => l.type !== "City" && l.unlock && l.unlock[0] === id);
  const tavernN = (id) => D.heroes.filter((h) => h.tavern && h.tavern[0] === id).length;

function builderCode(s) {
  const c = [s.hero, s.tier, s.task, s.cls, s.level, s.job, s.coreGrade, s.elixirs ? 1 : 0, s.skillMode === "cap" ? 1 : 0,
    CALC.SLOTS.map((sl) => { const g = s.gear[sl]; return g ? [g.id, g.q, g.lv, ...(g.affix || []).flat()].join(".") : ""; }).join("_")];
  return c.join("~");
}
function builderParse(code) {
  const p = code.split("~");
  if (p.length < 10) return null;
  const [hero, tier, task, cls, level, job, cg, el, sk, gear] = p;
  const s = { hero: +hero, tier: Math.max(0, Math.min(8, +tier)), task: taskOf(task) ? task : "single", cls: +cls, level: +level, job: +job, coreGrade: +cg || 1, elixirs: el === "1", skillMode: sk === "1" ? "cap" : "start", q: 5, gear: {} };
  if (!T("heroes", s.hero) || !T("classes", s.cls)) return null;
  gear.split("_").forEach((g, i) => {
    if (!g) return;
    const [id, q, lv, ...af] = g.split(".").map(Number);
    if (!T("items", id)) return;
    const affix = [];
    for (let k = 0; k + 1 < af.length; k += 2) affix.push([af[k], af[k + 1]]);
    s.gear[i + 1] = { id, q, lv, roll: 65 + 30 * q, affix };
  });
  return s;
}
function openBuilder(heroId, tier, task) {
  loadBuilds().then(() => {
    BS = builderFrom(heroId, tier, task);
    setCat("builder");
    setHash(`builder~${builderCode(BS)}`);
  });
}
// Exact "Name 中文" from the list, else the only hero whose name contains the text.
function findHero(v) {
  const q = v.trim().toLowerCase();
  if (!q) return null;
  const exact = D.heroes.find((h) => `${h.n} ${h.cn}`.toLowerCase() === q || h.n.toLowerCase() === q || h.cn === q);
  if (exact) return exact;
  const part = D.heroes.filter((h) => h.n.toLowerCase().includes(q) || h.cn.includes(q));
  return part.length === 1 ? part[0] : null;
}
function builderChange(el) {
  const s = BS;
  if (el.dataset.bs) {
    const k = el.dataset.bs, v = el.value;
    if (k === "heroq") {
      const h = findHero(v);
      if (!h) { renderBrowse(); return; }	// no match: put the current hero back
      if (h.id !== s.hero) { s.hero = h.id; s.cls = h.cls; }
    }
    else if (k === "hero") { s.hero = +v; s.cls = T("heroes", s.hero).cls; }
    else if (k === "tier") { s.tier = +v; s.level = 30 * (s.tier + 1); }
    else if (k === "elixirs") s.elixirs = v === "1";
    else if (k === "skillMode" || k === "task") s[k] = v;
    else s[k] = Math.max(1, Number(v) || 1);
  }
  else if (el.dataset.bg) {
    const [sl, f] = el.dataset.bg.split(":");
    if (f === "id") {
      if (!el.value) delete s.gear[sl];
      else { const old = s.gear[sl]; s.gear[sl] = Object.assign(CALC.gearPiece(+el.value, { quality: old ? old.q : s.q }), { affix: old ? old.affix || [] : [] }); }
    }
    else if (f === "q") { const q = +el.value, g = s.gear[sl]; Object.assign(g, CALC.gearPiece(g.id, { quality: q }), { affix: (g.affix || []).slice(0, q - 1) }); }
    else s.gear[sl].lv = Math.max(0, Number(el.value) || 0);
  }
  else if (el.dataset.baf) {
    const [sl, i, f] = el.dataset.baf.split(":");
    s.gear[sl].affix[i][f === "stat" ? 0 : 1] = Number(el.value) || 0;
  }
  setHash(`builder~${builderCode(s)}`);
  renderBrowse();
}

function matches(x, q) {
  return (x.n && String(x.n).toLowerCase().includes(q)) || (x.cn && String(x.cn).includes(q));
}
function currentRows() {
  if (state.q) {

    return out;
  }
  const c = CAT[state.cat];
  let rows = D[c.k].filter((x) => c.filters.every(([name, fn], i) => { const v = state.filters[i]; return v == null || fn(x) === v; }));
  const s = state.sort[c.k];

    const fn = s === "Name" ? null : (SORTS[c.k] || []).find(([n]) => n === s)?.[1];
    rows = rows.slice().sort(fn ? (a, b) => fn(a) - fn(b) || a.id - b.id : (a, b) => String(a.n).localeCompare(String(b.n)));

  return rows.map((x) => [c.k, x]);
}

  }).join("");
}
const KBD = `<span class="kbd"><kbd>/</kbd> search · <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> back</span>`;

function renderBrowse() {
  const c = CAT[state.cat];
  if (!state.q && c.view) {
    $("#main").innerHTML = `<div class="listhead"><h1>${esc(c.t)}</h1><p class="blurb">${esc(c.blurb)}</p></div><div id="rows" class="bare">${c.view()}</div>`;
    return;
  }
  const rows = currentRows();
  if (state.q) {
    let body;
    if (!rows.length) body = `<div class="empty">Nothing matches. Try another spelling, or search in Chinese.</div>`;
    else {
      const groups = new Map();
      rows.forEach((r) => { if (!groups.has(r[0])) groups.set(r[0], []); groups.get(r[0]).push(r); });
      body = [...groups].map(([k, arr]) => `<h3 class="grp">${esc(CAT[k].t)} · ${arr.length}</h3>${rowsHtml(arr.slice(0, 40), false)}${arr.length > 40 ? `<p class="note" style="padding:6px 16px 10px;margin:0">${arr.length - 40} more. Narrow the search to see them.</p>` : ""}`).join("");
    }
    $("#main").innerHTML = `<div class="listhead"><h1>Search <small>${rows.length} results for “${esc(state.q)}”</small></h1></div><div id="rows">${body}</div>`;
    return;
  }
  const fhtml = c.filters.map(([name, fn], i) => {
    const vals = [...new Set(D[c.k].map(fn))].filter((v) => v !== "" && v != null);
    if (vals.length < 2 || vals.length > 24) return "";
    const order = name === "Tier" || name === "Rank" ? vals : vals.sort((a, b) => String(a).localeCompare(String(b), "en", { numeric: true }));
    return `<div class="fgroup"><span>${esc(name)}</span><button type="button" class="chip" data-f="${i}" data-v="" aria-pressed="${state.filters[i] == null}">All</button>${order.map((v) => `<button type="button" class="chip" data-f="${i}" data-v="${esc(v)}" aria-pressed="${state.filters[i] === v}">${esc(v)}</button>`).join("")}</div>`;
  }).join("");
  const sorts = [["", "Game order"], ["Name", "Name A–Z"], ...(SORTS[c.k] || []).map(([n]) => [n, n])];
  const cur = state.sort[c.k] || "";
  const gridOn = !!state.grid[c.k] && GRIDABLE.has(c.k);
  const tools = `<div class="toolbar"><label for="sort">Sort <select id="sort">${sorts.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label>
    ${GRIDABLE.has(c.k) ? `<div class="seg" role="group" aria-label="View"><button type="button" data-view="list" aria-pressed="${!gridOn}">List</button><button type="button" data-view="grid" aria-pressed="${gridOn}">Icons</button></div>` : ""}${KBD}</div>`;
  let body;
  if (!rows.length) body = `<div id="rows"><div class="empty">Nothing matches. Try another filter.</div></div>`;
  else {
    const shown = rows.slice(0, state.limit);
    body = `<div id="rows"${gridOn ? ` class="bare"` : ""}>${rowsHtml(shown, false)}</div>` + (rows.length > shown.length ? `<button type="button" class="chip more" id="more">Show ${Math.min(200, rows.length - shown.length)} more of ${rows.length - shown.length}</button>` : "");
  }
  $("#main").innerHTML = `<div class="listhead"><h1>${esc(c.t)} <small>${rows.length} of ${D[c.k].length}</small></h1><p class="blurb">${esc(c.blurb)}</p>${fhtml ? `<div class="filters">${fhtml}</div>` : ""}${tools}</div>${body}`;
}

function parseTok(tok) { const [k, id] = tok.split(/-(?=\d+$)/); return [k, Number(id)]; }
function renderEntry() {
  const [k, id] = parseTok(state.sel);
  const x = T(k, id);
  if (!x) { state.mode = "browse"; return renderBrowse(); }
  const big = k === "heroes" ? 150 : k === "foes" ? 110 : 96;
  let body = R[k](x), lede = "";
  const m = body.match(/^<p class="desc">([\s\S]*?)<\/p>/);
  if (m) { lede = m[1]; body = body.slice(m[0].length); }
  const prev = hist.length ? (() => { const [pk, pid] = parseTok(hist[hist.length - 1]); return (T(pk, pid) || {}).n; })() : null;
  const listName = state.q ? `search “${state.q}”` : CAT[state.cat].t;
  const isStar = starred(state.sel);
  $("#main").innerHTML = `<article>
    <div class="crumbs"><button type="button" class="tbtn" id="back">← ${esc(prev ? prev : listName)}</button>${prev ? `<button type="button" class="tbtn" id="tolist">${esc(listName)}</button>` : ""}<span class="sp"></span><button type="button" class="tbtn" id="star" aria-pressed="${isStar}">${isStar ? "★ Starred" : "☆ Star"}</button></div>
    <header class="ehead"><div class="portrait">${iconOf(k, x, big)}</div><div><div class="kind">${esc(KIND[k] || CAT[k].t)}</div><h1>${esc(x.n)}</h1><div class="cn">${esc(x.cn)}</div>${lede ? `<p class="lede">${lede}</p>` : ""}</div></header>
    ${k === "heroes" ? heroBuilds(x) : ""}<div class="ebody">${body}</div></article>`;
}
function render() {
  renderNav();
  if (state.mode === "entry" && state.sel) renderEntry(); else renderBrowse();
}
function setHash(h) { try { history.replaceState(null, "", `#${h}`); } catch {} }
function toList() {
  state.mode = "browse"; hist.length = 0;
  render();
  setHash(state.q ? "" : state.cat);
  window.scrollTo(0, listScroll[state.q ? "_q" : state.cat] || 0);
  const cur = state.sel && document.querySelector(`#rows [data-go="${state.sel}"]`);
  if (cur) cur.focus({ preventScroll: true });
}
function go(token, opts = {}) {
  const [k] = parseTok(token);
  if (!by[k]) return;
  if (state.mode === "browse") { listScroll[state.q ? "_q" : state.cat] = window.scrollY; hist.length = 0; }
  else if (!opts.back && state.sel && state.sel !== token) { hist.push(state.sel); if (hist.length > 60) hist.shift(); }
  // Opening from a list keeps that list as "home"; opening a linked entry from another category follows it.
  if (!state.q && !CAT[state.cat].view && state.cat !== k && state.mode === "browse") { state.cat = k; state.filters = {}; }
  state.sel = token; state.mode = "entry";
  render();
  window.scrollTo(0, 0);
  if (!opts.noHash) setHash(token);
}
function setCat(k) {
  state.cat = k; state.filters = {}; state.q = ""; state.limit = 200; state.mode = "browse"; hist.length = 0; $("#q").value = "";
  render(); savePrefs(); window.scrollTo(0, 0); setHash(k);
}
function back() {
  const prev = hist.pop();
  if (prev) go(prev, { back: true }); else toList();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-cat],[data-group],[data-f],[data-view],[data-home],#more,#back,#tolist,#star,[data-rbt],[data-rbk],[data-bopen],[data-bestmore],[data-baddaff],[data-bdelaff],#bopt,#bcopy");
  if (!t) return;
  e.preventDefault();
  if (t.dataset.rbt != null || t.dataset.rbk != null) {
    if (t.dataset.rbt != null) rbState.tier = +t.dataset.rbt;
    else { rbState.task = t.dataset.rbk; rbState.pinned = true; }
    bestLimit = 50;
    if (state.mode === "entry") renderEntry(); else renderBrowse();
    return;
  }
  if (t.dataset.bopen) { const [h, tier, task] = t.dataset.bopen.split(":"); openBuilder(+h, +tier, task); return; }
  if (t.dataset.bestmore) { bestLimit = 1e9; renderBrowse(); return; }
  if (t.dataset.baddaff) { const g = BS.gear[t.dataset.baddaff]; (g.affix = g.affix || []).push([AFFIX_STATS()[0].id, 35 + 10 * g.q]); setHash(`builder~${builderCode(BS)}`); renderBrowse(); return; }
  if (t.dataset.bdelaff) { const [sl, i] = t.dataset.bdelaff.split(":"); BS.gear[sl].affix.splice(+i, 1); setHash(`builder~${builderCode(BS)}`); renderBrowse(); return; }
  if (t.id === "bopt") {
    const r = CALC.optimize(BS.hero, BS.tier, BS.task, { level: BS.level, job: BS.job, quality: BS.q, coreGrade: BS.coreGrade, elixirs: BS.elixirs });
    if (r) { BS.cls = r.build.cls; BS.gear = {}; Object.entries(r.build.gear).forEach(([sl, g]) => { BS.gear[sl] = Object.assign({}, g, { affix: [] }); }); }
    setHash(`builder~${builderCode(BS)}`); renderBrowse(); return;
  }
  if (t.id === "bcopy") {
    const url = location.href.split("#")[0] + `#builder~${builderCode(BS)}`;
    const done = () => { t.textContent = "Link copied"; setTimeout(() => { t.textContent = "Copy link"; }, 1600); };
    try { navigator.clipboard.writeText(url).then(done, () => prompt("Copy this link", url)); } catch { prompt("Copy this link", url); }
    return;
  }
  if (t.id === "more") { state.limit += 200; renderBrowse(); return; }
  if (t.id === "back") { back(); return; }
  if (t.id === "tolist") { toList(); return; }
  if (t.id === "star") {
    stars = starred(state.sel) ? stars.filter((s) => s !== state.sel) : [state.sel, ...stars];
    store("btc-stars", stars); render(); return;
  }
  if (t.dataset.home) { setCat("items"); return; }
  if (t.dataset.view) { state.grid[state.cat] = t.dataset.view === "grid"; savePrefs(); renderBrowse(); return; }
  if (t.dataset.group) { const first = CATS.find((c) => c.g === t.dataset.group); if (first) setCat(first.k); return; }
  if (t.dataset.cat) { setCat(t.dataset.cat); return; }
  if (t.dataset.f != null) { state.filters[t.dataset.f] = t.dataset.v === "" ? null : t.dataset.v; state.limit = 200; renderBrowse(); return; }
  go(t.dataset.go);
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.bs === "heroq") return;	// the combobox picks heroes itself
  if (BS && (e.target.dataset.bs || e.target.dataset.bg || e.target.dataset.baf)) { builderChange(e.target); return; }
  if (e.target.id === "sort") { state.sort[state.cat] = e.target.value || null; state.limit = 200; renderBrowse(); }
});
/* Hero combobox: the list always shows every hero; typing jumps to and highlights the first match. */
function combo() {
  const input = document.querySelector('[data-bs="heroq"]');
  return input && { input, list: document.getElementById("bheroes") };
}
function comboHl(li) {
  const c = combo();
  if (!c) return;
  c.list.querySelectorAll("li.hl").forEach((x) => { x.classList.remove("hl"); x.setAttribute("aria-selected", "false"); });
  if (!li) { c.input.removeAttribute("aria-activedescendant"); return; }
  li.classList.add("hl"); li.setAttribute("aria-selected", "true");
  c.input.setAttribute("aria-activedescendant", li.id);
  const top = li.offsetTop, bottom = top + li.offsetHeight;
  if (top < c.list.scrollTop || bottom > c.list.scrollTop + c.list.clientHeight) c.list.scrollTop = Math.max(0, top - c.list.clientHeight / 3);
}
function comboOpen() {
  const c = combo();
  if (!c || !c.list.hidden) return;
  c.list.hidden = false;
  c.input.setAttribute("aria-expanded", "true");
  comboHl(document.getElementById(`bh-${BS.hero}`));
}
function comboClose() {
  const c = combo();
  if (!c) return;
  c.list.hidden = true;
  c.input.setAttribute("aria-expanded", "false");
  const h = T("heroes", BS.hero);
  c.input.value = `${h.n} ${h.cn}`;
}
function comboPick(id) {
  if (id === BS.hero) { comboClose(); return; }
  const h = T("heroes", id);
  BS.hero = id; BS.cls = h.cls;
  setHash(`builder~${builderCode(BS)}`);
  renderBrowse();
}
// First hero whose name starts with the text, else one with a word starting with it, else one containing it.
function comboMatch(text) {
  const q = text.trim().toLowerCase(), c = combo();
  if (!q || !c) return null;
  const items = [...c.list.children], keys = items.map((li) => li.dataset.key.split("|"));
  const tests = [([n, cn]) => n.startsWith(q) || cn.startsWith(q), ([n]) => n.split(" ").some((w) => w.startsWith(q)), ([n, cn]) => n.includes(q) || cn.includes(q)];
  for (const t of tests) { const i = keys.findIndex(t); if (i >= 0) return items[i]; }
  return null;
}
document.addEventListener("input", (e) => {
  if (!BS || e.target.dataset.bs !== "heroq") return;
  comboOpen();
  comboHl(comboMatch(e.target.value));
});
document.addEventListener("focusin", (e) => {
  if (!BS || e.target.dataset.bs !== "heroq") return;
  comboOpen();
  e.target.select();
});
document.addEventListener("focusout", (e) => {
  if (BS && e.target.dataset.bs === "heroq") comboClose();
});
document.addEventListener("mousedown", (e) => {
  const li = e.target.closest("#bheroes li");
  if (!li) return;
  e.preventDefault();	// keep focus in the input so focusout does not close the list first
  comboPick(+li.dataset.hid);
});
let qt;
$("#q").addEventListener("input", (e) => {
  clearTimeout(qt);
  qt = setTimeout(() => { state.q = e.target.value.trim(); state.limit = 200; state.mode = "browse"; hist.length = 0; render(); window.scrollTo(0, 0); }, 140);
});
document.addEventListener("keydown", (e) => {
  const ae = document.activeElement;
  const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(ae?.tagName || "");
  if (BS && ae && ae.dataset && ae.dataset.bs === "heroq" && ["ArrowDown", "ArrowUp", "Enter", "Escape"].includes(e.key)) {
    e.preventDefault();
    const c = combo();
    comboOpen();
    const cur = c.list.querySelector("li.hl");
    if (e.key === "ArrowDown") comboHl(cur ? cur.nextElementSibling || cur : c.list.firstElementChild);
    else if (e.key === "ArrowUp") comboHl(cur ? cur.previousElementSibling || cur : c.list.lastElementChild);
    else if (e.key === "Enter") { if (cur) comboPick(+cur.dataset.hid); }
    else { comboClose(); ae.select(); }
    return;
  }
  if (e.key === "/" && !inField) { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape") {
    if (inField && $("#q").value) { $("#q").value = ""; state.q = ""; state.mode = "browse"; render(); return; }
    if (inField) { ae.blur(); return; }
    if (state.mode === "entry") back();
    return;
  }
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && state.mode === "browse" && (!inField || ae === $("#q"))) {
    const list = [...document.querySelectorAll("#rows [data-go]")];
    if (!list.length) return;
    e.preventDefault();
    let i = list.indexOf(ae);
    i = e.key === "ArrowDown" ? Math.min(list.length - 1, i + 1) : Math.max(0, i - 1);
    list[i].focus(); list[i].scrollIntoView({ block: "nearest" });
  }
});

fetch("compendium.json").then((r) => r.json()).then((data) => {
  D = data;
  for (const c of DATA_CATS) by[c.k] = new Map(D[c.k].map((x) => [x.id, x]));
  D._gov = new Set(D.locs.filter((l) => l.gov).map((l) => l.gov));
  CALC = BSTDCalc.make(D);
  if (prefs.cat && CAT[prefs.cat]) state.cat = prefs.cat;
  const h = (location.hash || "").slice(1);
  if (CAT[h]) state.cat = h;
  if (h.startsWith("builder~")) {
    state.cat = "builder";
    loadBuilds().then(() => { BS = builderParse(decodeURIComponent(h.slice(8))); if (state.cat === "builder" && state.mode === "browse") renderBrowse(); }).catch(() => {});
  }
  if (h && /^[a-z]+-\d+$/.test(h) && by[parseTok(h)[0]]) { state.cat = parseTok(h)[0]; go(h, { noHash: true }); }
  else render();
}).catch(() => { $("#main").innerHTML = `<div class="empty">The data file failed to load. Reload the page to try again.</div>`; });
</script>
